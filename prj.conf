# ===== General =====
CONFIG_FPU=y
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ===== Modem =====
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_MODEM_SLEEP_MODULE=y

# ===== AT host for serial diagnostics (AT+CEREG?, AT%XMONITOR, etc.) =====
CONFIG_AT_HOST_LIBRARY=y

# ===== Networking / MQTT (Phase 2) =====
# nRF91xx: TLS is offloaded to the modem — do NOT enable native mbedtls stack.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MODEM_INFO=y

# ===== Sensors =====
CONFIG_SENSOR=y
CONFIG_W1=y
CONFIG_W1_ZEPHYR_GPIO=y
CONFIG_DS18B20=y
CONFIG_BME280=y

# ===== Stack / heap (increased for MQTT + TLS) =====
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
